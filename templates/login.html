
{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
    
        <div class="container">
            <div class="section">

                <h2>Login</h2>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input name="username" id="username" type="text" placeholder="Enter Username" class="form-control" autofocus autocomplete="on" required>
                    </div>
                    <br>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input name="password" id="password" type="password" placeholder="Enter Password" class="form-control" autofocus autocomplete="on" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p class="mt-3">Don't have an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
            </div>
        </div>

{% endblock %}
