
{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    
        <div class="container">
            <div class="section">

                <h2>Register</h2>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="new-username" class="form-label">Username</label>
                        <input name="username" id="new-username" type="text" placeholder="Choose your Username" class="form-control" autofocus autocomplete="on" required>
                    </div>
                    <br>
                    <div class="mb-3">
                        <label for="new-password" class="form-label">Password</label>
                        <input name="password" id="new-password" type="password" placeholder="Choose a Password" class="form-control" autofocus autocomplete="on" required>
                    </div>
                    <button type="submit" class="btn btn-success">Register</button>
                </form>
                <p class="mt-3">Already have an account? <a href="{{ url_for('login') }}">Login here</a>.</p>
            </div>
        </div>

{% endblock %}
