<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

        <title> Historical Data</title>
        
    </head>

    <body>

        <nav class="bg-light border navbar navbar-expand-md navbar-light">
            <div class="container-fluid">
              <a class="apy-heading" href="/">APY Calculator</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                      data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
              </button>
          
              <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav me-auto mt-2">
                  <li class="nav-item"><a class="nav-link" href="/calculate">Calculate</a></li>
                  <li class="nav-item"><a class="nav-link" href="/alert">APY Alert</a></li>
                </ul>
          
                <ul class="navbar-nav ms-auto">
                  {% if current_user.is_authenticated %}
                    <li class="nav-item">
                      <span class="navbar-text me-2">Hi, {{ current_user.username }}</span>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                  {% else %}
                    <li class="nav-item">
                      <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="{{ url_for('register') }}">Register</a>
                    </li>
                  {% endif %}
                </ul>
              </div>
            </div>
          </nav>
        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>

        <footer class="mb-5">
            <p>not built yet </p>
            <script>

            </script>
        </footer>

        {% block scripts %}{% endblock %}
        <script src="{{ url_for('static', filename='script.js') }}"></script>
        <script src = "https://cdn.jsdelivr.net/npm/chart.js"></script>
    </body>
</html>
